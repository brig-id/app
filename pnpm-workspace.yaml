allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
minimumReleaseAgeExclude:
  - "@web.awesome.me/webawesome-pro@3.11.0"
  - esbuild@0.28.1
  - sharp@0.35.0
  - brace-expansion@1.1.17
overrides:
  # vite-imagetools pins an older sharp with known libvips CVEs
  # (GHSA-f88m-g3jw-g9cj); force the patched line. Dev-only build tool
  # (image asset processing), never shipped to the browser.
  sharp: ">=0.35.0"
  # postcss (via vite/qwik) pins an old nanoid with an infinite-loop bug on
  # zero-size custom generators (GHSA-2v37-7h3g-55p8). Dev-only build tool.
  nanoid: ">=3.3.18"
