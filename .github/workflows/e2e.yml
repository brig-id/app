name: E2E

# The Playwright suite (sign-up, sign-in, passkeys) against a real server, and
# the demonstration site's against a server with this interface: seedling at
# the head of its main, built with the core and crypto at the head of theirs,
# so that a run says what this change will meet. A branch of the same name
# with an open pull request in another repository is taken instead of its
# main: a change that spans repositories is tested whole before it is merged.
# The steps are in brig-id/.github, integration.yml, which the other
# repositories run with their own changes.

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: brig-id/.github/.github/workflows/integration.yml@main
    with:
      heads: true
      suites: interface demo
