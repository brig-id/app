name: E2E

# Custom (not a brig-id/.github reusable workflow): this suite drives a real
# `leaf` binary from the sibling brig-id/server-leaf repo, which itself pulls
# brig-id/core and brig-id/crypto as git dependencies at build time — that
# multi-repo shape is specific to this suite, not something a generic JS/web
# reusable template should carry.

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (register/login/passkeys against a real leaf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: web

      - name: Checkout server-leaf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: brig-id/server-leaf
          ref: main
          path: server-leaf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y mold

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('server-leaf/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Configure Web Awesome Pro registry auth
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          # Empty on pull requests from forks and from Dependabot: nothing to configure.
          [ -n "$WEBAWESOME_NPM_TOKEN" ] || exit 0
          echo "//npm.cloudsmith.io/fortawesome/webawesome-pro/:_authToken=$WEBAWESOME_NPM_TOKEN" >> ~/.npmrc

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"
          working-directory: web

      - name: Build leaf
        # Playwright starts leaf with `cargo run` and waits 60 s for its port:
        # enough to start a binary, not to compile one. Build it beforehand.
        run: cargo build --manifest-path server-leaf/Cargo.toml

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E suite
        working-directory: web
        env:
          SERVER_LEAF_DIR: ${{ github.workspace }}/server-leaf
          CI: "true"
        run: pnpm run test.e2e

      - name: Upload Playwright traces on failure
        # playwright.config.ts uses the "github" reporter in CI (inline PR
        # annotations, no HTML report file) — test-results/ still holds a
        # trace.zip per failed test (trace: "on-first-retry"), viewable via
        # `npx playwright show-trace`.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 14
