name: Release

# release-please keeps one pull request up to date with the next version and
# its changelog entry, from the commits merged to main. Merging that pull
# request is the release: the tag `vX.Y.Z` and the GitHub Release follow.
# Nobody tags by hand. The shared workflow also starts CI and E2E on that
# pull request, which would otherwise have no check at all.
#
# The servers embed the interface built from source at a tag and its commit:
# a release here is what they pin, and Renovate proposes it to them.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: brig-id/.github/.github/workflows/release.yml@b5d01e58e844ef8c4fa8f1799ad56a2dbe9651a7
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      workflows: ci.yml e2e.yml
